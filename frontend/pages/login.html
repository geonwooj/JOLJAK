<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Patent Office • 로그인</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/modal.css" />
  </head>

  <body>
    <div class="login-container">
      <!-- Logo -->
      <div class="login-header">
        <a href="../index.html" class="logo-link">
          <div class="logo">
            <img
              src="../assets/images/logo.svg"
              alt="AI Patent Office Logo"
              class="hero-logo"
            />
          </div>
          <h1>AI Patent Office</h1>
        </a>
        <p>로그인하여 시작하세요</p>
      </div>

      <!-- Form -->
      <form class="login-form">
        <label>
          이메일
          <input type="email" class="input" placeholder="example@email.com" />
        </label>

        <label>
          비밀번호
          <input type="password" class="input" placeholder="••••••••" />
        </label>

        <div class="login-options">
          <label class="remember">
            <input type="checkbox" />
            로그인 상태 유지
          </label>
          <a href="./forgot-password.html" class="link">비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn-primary">로그인</button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <span>계정이 없으신가요?</span>
        <a href="./signup.html" class="link">회원가입</a>
      </div>
    </div>

    <script src="../js/login.js"></script>
    <script src="../js/modal.js"></script>
  </body>
</html>
